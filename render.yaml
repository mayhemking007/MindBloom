services:
  - type: web
    name: mindbloom-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build:api
    startCommand: npm run memo:migrate && npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MEMO_GRAFTER_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CORS_ORIGIN
        sync: false
